[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "livetalking-sales"
version = "1.0.0"
description = "Vietnamese livestream-sales digital human (MuseTalk/Wav2Lip + F5-TTS + sales brain + TikTok scraper)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "LiveTalking" }
]
keywords = ["digital-human", "livestream", "tts", "tiktok", "vietnamese", "musetalk", "wav2lip", "f5-tts"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Dependencies được khai báo trong requirements.txt (single source of truth).
# Để pip install . dùng được, list dynamic:
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["avatars*", "brain*", "server*", "streamout*", "studio*", "tts*", "utils*"]
exclude = ["data*", "models*", "scripts*", "web*", "assets*", "venv*", "tests*"]

[project.scripts]
livetalking = "app:main"

[project.urls]
Homepage = "https://github.com/lipku/LiveTalking"
