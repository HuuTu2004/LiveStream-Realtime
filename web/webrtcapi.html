<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiveTalking AI Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 1.5rem;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        header {
            width: 100%;
            max-width: 1000px;
            margin-bottom: 2rem;
            text-align: left;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 600;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-dim);
            font-size: 1.1rem;
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .video-section {
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--glass-border);
            width: 100%;
            min-height: 400px;
        }

        video {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .status-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            padding: 0.5rem 1rem;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid var(--glass-border);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
        }

        .control-sidebar {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .control-group h3 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
        }

        .btn {
            cursor: pointer;
            padding: 0.75rem 1.25rem;
            border-radius: 12px;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.2s ease;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.95rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }

        .btn-stop {
            background: #ef4444;
            color: white;
        }

        .btn-stop:hover {
            background: #dc2626;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--glass-border);
            color: var(--text-main);
        }

        .btn-outline:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.05);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .chat-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 1rem;
            color: var(--text-main);
            font-family: inherit;
            resize: none;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        .hidden {
            display: none !important;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container > * {
            animation: fadeIn 0.5s ease forwards;
        }

        .container > *:nth-child(2) {
            animation-delay: 0.1s;
        }
    </style>
</head>
<body>

    <header>
        <h1>LiveTalking AI</h1>
        <p>Real-time Digital Human Interaction</p>
    </header>

    <div class="container">
        <!-- Main Media Panel -->
        <div class="glass-panel">
            <div id="media">
                <div class="video-section">
                    <div class="status-badge" id="conn-status">
                        <div class="status-dot" style="background: #94a3b8; box-shadow: none;"></div>
                        <span>Idle</span>
                    </div>
                    <audio id="audio" autoplay="true"></audio>
                    <video id="video" autoplay="true" playsinline="true" poster="https://via.placeholder.com/1280x720/0f172a/94a3b8?text=Waiting+for+Stream"></video>
                </div>
            </div>

            <div class="chat-section" style="margin-top: 1.5rem;">
                <form id="echo-form">
                    <textarea id="message" rows="3" placeholder="Type something for the AI to say..."></textarea>
                    <div style="display: flex; justify-content: flex-end; margin-top: 0.75rem;">
                        <button type="submit" class="btn btn-primary" style="padding-left: 2rem; padding-right: 2rem;">
                            Speak
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Control Sidebar -->
        <div class="control-sidebar">
            <div class="glass-panel control-group">
                <h3>Session Controls</h3>
                <button id="start" class="btn btn-primary" onclick="start()">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    Start Stream
                </button>
                <button id="stop" class="btn btn-stop hidden" onclick="stop()">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H10a1 1 0 01-1-1v-4z"/></svg>
                    Stop Stream
                </button>
                
                <div class="option-item">
                    <input id="use-stun" type="checkbox"/>
                    <label for="use-stun">Use STUN server</label>
                </div>
            </div>

            <div class="glass-panel control-group">
                <h3>Recording</h3>
                <button class="btn btn-outline" id="btn_start_record">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                    Start Recording
                </button>
                <button class="btn btn-stop" id="btn_stop_record" disabled>
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1H10a1 1 0 01-1-1v-4z"/></svg>
                    Stop Recording
                </button>
            </div>

            <input type="hidden" id="sessionid" value="0">
        </div>
    </div>

    <script src="client.js"></script>
    <script type="text/javascript" src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" charset="utf-8">
        $(document).ready(function() {
            // Update UI status when starting/stopping
            const originalStart = window.start;
            const originalStop = window.stop;

            window.start = function() {
                originalStart();
                $('#conn-status span').text('Connecting...');
                $('#conn-status .status-dot').css({'background': '#f59e0b', 'box-shadow': '0 0 8px #f59e0b'});
                $('#start').addClass('hidden');
                $('#stop').removeClass('hidden');
            };

            window.stop = function() {
                originalStop();
                $('#conn-status span').text('Idle');
                $('#conn-status .status-dot').css({'background': '#94a3b8', 'box-shadow': 'none'});
                $('#stop').addClass('hidden');
                $('#start').removeClass('hidden');
            };

            // Custom event listener for peer connection status (simplified)
            // Note: client.js handles actual pc setup
            
            $('#echo-form').on('submit', function(e) {
                e.preventDefault();
                var message = $('#message').val();
                if (!message.trim()) return;

                console.log('Sending: ' + message);
                fetch('/human', {
                    body: JSON.stringify({
                        text: message,
                        type: 'echo',
                        interrupt: true,
                        sessionid: String(document.getElementById('sessionid').value),
                    }),
                    headers: { 'Content-Type': 'application/json' },
                    method: 'POST'
                });
                $('#message').val('');
            });

            $('#btn_start_record').click(function() {
                console.log('Starting recording...');
                fetch('/record', {
                    body: JSON.stringify({
                        type: 'start_record',
                        sessionid: String(document.getElementById('sessionid').value),
                    }),
                    headers: { 'Content-Type': 'application/json' },
                    method: 'POST'
                }).then(function(response) {
                    if (response.ok) {
                        $('#btn_start_record').prop('disabled', true);
                        $('#btn_stop_record').prop('disabled', false);
                    }
                });
            });

            $('#btn_stop_record').click(function() {
                console.log('Stopping recording...');
                fetch('/record', {
                    body: JSON.stringify({
                        type: 'end_record',
                        sessionid: String(document.getElementById('sessionid').value),
                    }),
                    headers: { 'Content-Type': 'application/json' },
                    method: 'POST'
                }).then(function(response) {
                    if (response.ok) {
                        $('#btn_start_record').prop('disabled', false);
                        $('#btn_stop_record').prop('disabled', true);
                    }
                });
            });
        });
    </script>
</body>
</html>
